<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis Lab</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        font-size: 1rem;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Axis Lab</h1>
      <p>Minimal experiments. Maximum focus.</p>
    </main>
  </body>
</html>
